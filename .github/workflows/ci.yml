name: CI

env:
  AHEART_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qg5_only && 'qg5' || 'full' }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      qg5_only:
        description: Run only the five QG5 browser projects for stability evidence
        type: boolean
        required: false
        default: false
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    branches:
      - master

jobs:
  unit:
    name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qg5_only && 'unit (not requested)' || 'unit' }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/master' || !inputs.qg5_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build package outputs
        run: pnpm build
      - name: Unit and script tests
        run: pnpm test

  typecheck:
    name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qg5_only && 'typecheck (not requested)' || 'typecheck' }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/master' || !inputs.qg5_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build package outputs
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck

  coverage:
    name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qg5_only && 'coverage (not requested)' || 'coverage' }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/master' || !inputs.qg5_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build package outputs
        run: pnpm build
      - name: R1 branch coverage
        run: pnpm test:coverage:r1
      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d9-r1-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/components/coverage/
            packages/dnd/coverage/
            packages/ai/coverage/
          if-no-files-found: error

  build-generated:
    name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qg5_only && 'build-generated (not requested)' || 'build-generated' }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/master' || !inputs.qg5_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check Build Determinism and Generated Output
        id: build_generated
        run: pnpm check:build-determinism
      - name: Capture Build Diagnostics
        if: ${{ failure() && steps.build_generated.outcome == 'failure' }}
        run: |
          mkdir -p test-results/build-generated-diagnostics
          git ls-files -- packages/components packages/ai packages/dnd | grep -E '^packages/[^/]+/(dist|es|lib)/' > test-results/build-generated-diagnostics/generated-tracked.txt || test "$?" -eq 1
      - name: Upload Build Diagnostics
        if: ${{ failure() && steps.build_generated.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-generated-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/build-generated-diagnostics/
          if-no-files-found: error
      - name: Check Whitespace
        run: git diff --check

  docs:
    name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qg5_only && 'docs (not requested)' || 'docs' }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/master' || !inputs.qg5_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Docs
        run: pnpm docs:build

  consumer:
    name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qg5_only && 'consumer (not requested)' || 'consumer' }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/master' || !inputs.qg5_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The V1 CSS check reads full.css from the frozen V0 commit.
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build package outputs
        run: pnpm build
      - name: Verify Release Tarballs
        run: pnpm release:pack --pack-destination test-results/release-tarballs
      - name: Verify legacy paths against the public 1.x baseline
        run: |
          mkdir -p test-results/v2-baseline/packs
          npm pack --ignore-scripts --json --registry=https://registry.npmjs.org/ --pack-destination test-results/v2-baseline/packs aheart-ui@1.4.0 @aheart-ui/ai@1.2.0 @aheart-ui/dnd@1.1.0 > test-results/v2-baseline/npm-pack.json
          cp test-results/v2-baseline/packs/aheart-ui-dnd-1.1.0.tgz test-results/release-tarballs/
          node scripts/v2-legacy-consumer.mjs
      - name: Verify AI Chat without DND
        run: node scripts/v2-ai-optional-consumer.mjs
      - name: Strict packed consumer types (workspace Vue and Vue 3.5.44)
        run: pnpm check:consumer-types
      - name: V1 all Ready entry JS CSS and module boundaries
        run: pnpm check:v1-consumer
      - name: V1 packed SSR hydration and full versus scoped styles
        run: pnpm check:v1-visual-consumer
      - name: V1 public pilot rollback
        run: |
          mkdir -p test-results/v1-pilot-compatibility
          for engine in chromium firefox webkit; do
            node pilots/run-baselines.mjs --entry-mode legacy --only clean-consumer,ai-review-gate \
              --core-version 1.4.0 --ai-version 1.2.0 --dnd-version 1.1.0 \
              --baseline-lock-dir evidence/V2/baseline \
              --browser "$engine" --out "test-results/v1-pilot-compatibility/$engine"
          done
      - name: V2 codemod migration of the two pilots
        run: |
          core_version="$(node -p 'require("./packages/components/package.json").version')"
          ai_version="$(node -p 'require("./packages/ai/package.json").version')"
          mkdir -p test-results/v2-migrated-pilots
          for engine in chromium firefox webkit; do
            node pilots/run-baselines.mjs --entry-mode migrated --only clean-consumer,ai-review-gate \
              --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" \
              --ai-tarball "test-results/release-tarballs/aheart-ui-ai-$ai_version.tgz" \
              --dnd-tarball test-results/v2-baseline/packs/aheart-ui-dnd-1.1.0.tgz \
              --browser "$engine" --out "test-results/v2-migrated-pilots/$engine"
          done
      - name: V1 and V2 development diagnostics and migration codemod
        run: |
          node scripts/v2-migration-consumer.mjs --baseline --pack-dir test-results/v2-baseline/packs --out test-results/v2-migration-baseline
          pnpm check:v2-migration-consumer
      - name: Preserve persisted state through upgrade and rollback
        run: |
          core_version="$(node -p 'require("./packages/components/package.json").version')"
          node pilots/run-baselines.mjs --only muxu-todo --core-version 1.4.0 --out test-results/v2-state-baseline
          project="$(node -p 'require("./test-results/v2-state-baseline/results.json").pilots[0].project')"
          node pilots/check-rollback.mjs --project "$project" --baseline-version 1.4.0 \
            --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" --out test-results/v2-state-rollback
      - name: Pack and run isolated consumers
        run: |
          pack_dir=$(mktemp -d)
          root_out=$(mktemp -d)
          form_out=$(mktemp -d)
          d8_out=$(mktemp -d)
          pnpm --dir packages/components pack --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          pnpm --dir packages/dnd pack --json --pack-destination "$pack_dir" > "$pack_dir/dnd-pack.json"
          pnpm --dir packages/ai pack --json --pack-destination "$pack_dir" > "$pack_dir/ai-pack.json"
          components_tarball="$(node -p 'require(process.argv[1]).filename' "$pack_dir/pack.json")"
          dnd_tarball="$(node -p 'require(process.argv[1]).filename' "$pack_dir/dnd-pack.json")"
          ai_tarball="$(node -p 'require(process.argv[1]).filename' "$pack_dir/ai-pack.json")"
          node scripts/root-entry-consumer.mjs --tarball "$components_tarball" --out "$root_out"
          node scripts/form-list-consumer.mjs --tarball "$components_tarball" --out "$form_out"
          node docs/superpowers/experiments/d8-consumer/run.mjs --out "$d8_out" --components-tarball "$components_tarball" --dnd-tarball "$dnd_tarball" --ai-tarball "$ai_tarball"
          mkdir -p test-results/d9-consumers
          cp "$root_out/results.json" test-results/d9-consumers/root-results.json
          cp "$form_out/results.json" test-results/d9-consumers/form-results.json
          cp "$d8_out/results.json" test-results/d9-consumers/d8-results.json
      - name: M3 scoped entries, CSS and resolver
        run: pnpm check:m3-consumer
      - name: M3 packed consumer and Workbench pilot
        run: |
          core_version="$(node -p 'require("./packages/components/package.json").version')"
          ai_version="$(node -p 'require("./packages/ai/package.json").version')"
          node pilots/run-baselines.mjs --entry-mode subpath --only clean-consumer,ai-review-gate \
            --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" \
            --ai-tarball "test-results/release-tarballs/aheart-ui-ai-$ai_version.tgz" \
            --dnd-tarball test-results/release-tarballs/aheart-ui-dnd-1.1.0.tgz \
            --out test-results/m3-pilots
      - name: M1 public entries, CSS and module graph
        run: pnpm check:m1-consumer
      - name: M1 split and compatibility pilot paths
        run: |
          core_version="$(node -p 'require("./packages/components/package.json").version')"
          ai_version="$(node -p 'require("./packages/ai/package.json").version')"
          mkdir -p test-results/m1-pilots
          node pilots/run-baselines.mjs --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" \
            --ai-tarball "test-results/release-tarballs/aheart-ui-ai-$ai_version.tgz" \
            --dnd-tarball test-results/release-tarballs/aheart-ui-dnd-1.1.0.tgz \
            --entry-mode subpath --out test-results/m1-pilots/chromium
          for engine in firefox webkit; do
            node pilots/run-baselines.mjs --core-tarball "test-results/release-tarballs/aheart-ui-$core_version.tgz" \
              --entry-mode subpath --only clean-consumer --browser "$engine" --out "test-results/m1-pilots/$engine"
          done
      - name: Upload Consumer Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/release-tarballs/*.tgz
            test-results/v2-legacy-consumer/results.json
            test-results/v2-ai-optional-consumer/*.log
            test-results/v2-ai-optional-consumer/results.json
            test-results/v1-consumer/
            test-results/v1-visual-consumer/
            test-results/v1-pilot-compatibility/
            test-results/v2-migrated-pilots/
            test-results/v2-state-rollback/
            test-results/v2-migration-consumer/
            test-results/v2-migration-baseline/
            test-results/m1-consumer/
            test-results/m3-consumer/*.log
            test-results/m3-consumer/results.json
            test-results/m3-pilots/results.json
            test-results/m3-pilots/*/results.json
            test-results/m3-pilots/*/module-graph.json
            test-results/m1-pilots/
            test-results/d9-consumers/*-results.json
            test-results/d9-consumers/strict/results.json
            test-results/d9-consumers/strict/vue-*/*.log
          if-no-files-found: error

  browser:
    name: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qg5_only && 'browser (not requested)' || 'browser' }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/master' || !inputs.qg5_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: End-to-End Tests
        id: e2e
        run: pnpm test:e2e:non-qg5
      - name: Upload End-to-End Evidence
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn

  qg5-cross-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop
          - mobile
          - desktop-firefox
          - desktop-webkit
          - mobile-webkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: QG5 E2E
        run: pnpm exec playwright test e2e/cross-browser-production.spec.ts e2e/cross-browser-r1.spec.ts --project "${{ matrix.project }}"
      - name: Upload QG5 Playwright Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qg5-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
